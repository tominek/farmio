<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:100%;height:60px;display:flex;align-items:center;gap:6px;padding:0 8px;background:#FFFAF0;border:2px solid #8B5A3C;border-radius:14px;box-shadow:0 4px 0 rgba(59,42,30,0.35);font-family:'Atkinson Hyperlegible',sans-serif;color:#3B2A1E;box-sizing:border-box">
  <div title="Quacks" style="display:flex;align-items:center;gap:8px;height:42px;padding:0 14px 0 8px;background:#FBEFC9;border:1.5px solid #E2C27A;border-radius:10px"><svg width="28" height="28"><use href="#i-qk"></use></svg><span style="font-weight:700;font-size:21px;font-variant-numeric:tabular-nums">1&nbsp;840</span></div>
  <div title="Planks — short for construction" style="display:flex;align-items:center;gap:6px;height:42px;padding:0 10px;border-radius:10px;background:#FFF1E4;border:1.5px solid #F0B395"><svg width="24" height="24"><use href="#i-planks"></use></svg><span style="font-weight:700;font-size:18px;color:#A23E22">35</span></div>
  <div style="display:flex;align-items:center;gap:6px;height:42px;padding:0 10px"><svg width="24" height="24"><use href="#i-logs"></use></svg><span style="font-weight:700;font-size:18px">120</span></div>
  <div style="display:flex;align-items:center;gap:6px;height:42px;padding:0 10px"><svg width="24" height="24"><use href="#i-wheat"></use></svg><span style="font-weight:700;font-size:18px">1&nbsp;240</span><span style="font-size:14px;color:#6B5644">kg</span></div>
  <div title="Seeds: wheat 200 kg · potato 120 kg · corn 60 kg · sugar beet 0 kg" style="display:flex;align-items:center;gap:6px;height:42px;padding:0 10px;border-radius:10px;cursor:default" style-hover="background:#F3EBD8"><svg width="24" height="24"><use href="#i-seeds"></use></svg><span style="font-weight:700;font-size:18px">380</span><span style="font-size:14px;color:#6B5644">kg</span></div>
  <div style="display:flex;align-items:center;gap:6px;height:42px;padding:0 10px"><svg width="24" height="24"><use href="#i-flour"></use></svg><span style="font-weight:700;font-size:18px">410</span><span style="font-size:14px;color:#6B5644">kg</span></div>
  <div style="display:flex;align-items:center;gap:6px;height:42px;padding:0 10px"><svg width="24" height="24"><use href="#i-gravel"></use></svg><span style="font-weight:700;font-size:18px">300</span><span style="font-size:14px;color:#6B5644">kg</span></div>
  <div style="flex:1"></div>
  <div style="display:flex;align-items:center;gap:8px;height:42px;padding:0 12px;border-radius:10px;background:#F3EBD8"><svg width="26" height="26"><use href="#i-worker"></use></svg><span style="font-weight:700;font-size:18px">4 idle</span><span style="font-size:16px;color:#6B5644">/ 7</span></div>
  <sc-if value="{{ tOff }}" hint-placeholder-val="{{ true }}"><div style="display:flex;align-items:center;gap:8px;height:42px;padding:0 12px;border-radius:10px;background:#F3EBD8;cursor:pointer" style-hover="background:#EADFC8"><span style="min-width:28px;height:26px;padding:0 8px;border-radius:13px;background:#3B2A1E;color:#FFFAF0;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center">12</span><span style="font-size:16px">tasks waiting</span></div></sc-if>
  <sc-if value="{{ tOn }}" hint-placeholder-val="{{ false }}"><div style="display:flex;align-items:center;gap:8px;height:42px;padding:0 12px;border-radius:10px;background:#DCEAF6;border:2px solid #2F6A9C;color:#1F4E77"><span style="min-width:28px;height:26px;padding:0 8px;border-radius:13px;background:#2F6A9C;color:#FFFAF0;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center">12</span><span style="font-size:16px">tasks waiting</span></div></sc-if>
  <div style="display:flex;gap:2px;padding:3px;background:#F3EBD8;border:1.5px solid #C9A06A;border-radius:10px;font-family:Fredoka,sans-serif;font-weight:600;font-size:16px">
    <div title="Pause (Space)" style="width:40px;height:34px;display:flex;align-items:center;justify-content:center;gap:4px;border-radius:7px;cursor:pointer" style-hover="background:#FFFAF0"><span style="width:4px;height:14px;background:#3B2A1E;border-radius:1px"></span><span style="width:4px;height:14px;background:#3B2A1E;border-radius:1px"></span></div>
    <div style="width:40px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:7px;background:#4E7D38;color:#FFFAF0">1×</div>
    <div style="width:40px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:7px;cursor:pointer" style-hover="background:#FFFAF0">2×</div>
    <div style="width:40px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:7px;cursor:pointer" style-hover="background:#FFFAF0">3×</div>
  </div>
  <div style="flex:1"></div>
  <sc-if value="{{ dOn }}" hint-placeholder-val="{{ false }}"><div style="display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;background:#DCEAF6;border:2px solid #2F6A9C;border-radius:10px;box-shadow:0 1px 0 #2F6A9C;transform:translateY(2px);font-family:Fredoka,sans-serif;font-weight:600;font-size:16px;color:#1F4E77"><svg width="20" height="20"><use href="#i-qk"></use></svg>Dealer</div></sc-if>
  <sc-if value="{{ dOff }}" hint-placeholder-val="{{ true }}"><div style="display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;background:#FFFAF0;border:2px solid #8B5A3C;border-radius:10px;box-shadow:0 3px 0 #8B5A3C;font-family:Fredoka,sans-serif;font-weight:600;font-size:16px;cursor:pointer" style-hover="background:#F6EBD3"><svg width="20" height="20"><use href="#i-qk"></use></svg>Dealer</div></sc-if>
  <sc-if value="{{ pOn }}" hint-placeholder-val="{{ false }}"><div style="display:flex;align-items:center;gap:8px;height:40px;padding:0 10px 0 12px;background:#DCEAF6;border:2px solid #2F6A9C;border-radius:10px;box-shadow:0 1px 0 #2F6A9C;transform:translateY(2px);font-family:Fredoka,sans-serif;font-weight:600;font-size:16px;color:#1F4E77">Priorities<span style="min-width:22px;height:22px;padding:0 5px;display:inline-flex;align-items:center;justify-content:center;border:1.5px solid #2F6A9C;border-radius:5px;background:#FFFAF0;font-family:'Atkinson Hyperlegible',sans-serif;font-weight:700;font-size:12px">P</span></div></sc-if>
  <sc-if value="{{ pOff }}" hint-placeholder-val="{{ true }}"><div style="display:flex;align-items:center;gap:8px;height:40px;padding:0 10px 0 12px;background:#FFFAF0;border:2px solid #8B5A3C;border-radius:10px;box-shadow:0 3px 0 #8B5A3C;font-family:Fredoka,sans-serif;font-weight:600;font-size:16px;cursor:pointer" style-hover="background:#F6EBD3">Priorities<span style="min-width:22px;height:22px;padding:0 5px;display:inline-flex;align-items:center;justify-content:center;border:1.5px solid #8B5A3C;border-radius:5px;background:#F3EBD8;font-family:'Atkinson Hyperlegible',sans-serif;font-weight:700;font-size:12px">P</span></div></sc-if>
  <sc-if value="{{ rOn }}" hint-placeholder-val="{{ false }}"><div style="display:flex;align-items:center;gap:8px;height:40px;padding:0 10px 0 12px;background:#DCEAF6;border:2px solid #2F6A9C;border-radius:10px;box-shadow:0 1px 0 #2F6A9C;transform:translateY(2px);font-family:Fredoka,sans-serif;font-weight:600;font-size:16px;color:#1F4E77">Research<span style="min-width:22px;height:22px;padding:0 5px;display:inline-flex;align-items:center;justify-content:center;border:1.5px solid #2F6A9C;border-radius:5px;background:#FFFAF0;font-family:'Atkinson Hyperlegible',sans-serif;font-weight:700;font-size:12px">T</span></div></sc-if>
  <sc-if value="{{ rOff }}" hint-placeholder-val="{{ true }}"><div style="display:flex;align-items:center;gap:8px;height:40px;padding:0 10px 0 12px;background:#FFFAF0;border:2px solid #8B5A3C;border-radius:10px;box-shadow:0 3px 0 #8B5A3C;font-family:Fredoka,sans-serif;font-weight:600;font-size:16px;cursor:pointer" style-hover="background:#F6EBD3">Research<span style="min-width:22px;height:22px;padding:0 5px;display:inline-flex;align-items:center;justify-content:center;border:1.5px solid #8B5A3C;border-radius:5px;background:#F3EBD8;font-family:'Atkinson Hyperlegible',sans-serif;font-weight:700;font-size:12px">T</span></div></sc-if>
<div style="width:2px;height:32px;background:#E8DAC0;border-radius:1px"></div>
  <sc-if value="{{ mOff }}" hint-placeholder-val="{{ true }}"><div title="Menu (Esc)" style="width:44px;height:40px;display:flex;align-items:center;justify-content:center;background:#FFFAF0;border:2px solid #8B5A3C;border-radius:10px;box-shadow:0 3px 0 #8B5A3C;cursor:pointer" style-hover="background:#F6EBD3"><span style="display:flex;flex-direction:column;gap:4px"><span style="width:20px;height:3px;border-radius:2px;background:#3B2A1E"></span><span style="width:20px;height:3px;border-radius:2px;background:#3B2A1E"></span><span style="width:20px;height:3px;border-radius:2px;background:#3B2A1E"></span></span></div></sc-if>
  <sc-if value="{{ mOn }}" hint-placeholder-val="{{ false }}"><div style="width:44px;height:40px;display:flex;align-items:center;justify-content:center;background:#DCEAF6;border:2px solid #2F6A9C;border-radius:10px;box-shadow:0 1px 0 #2F6A9C;transform:translateY(2px)"><span style="display:flex;flex-direction:column;gap:4px"><span style="width:20px;height:3px;border-radius:2px;background:#1F4E77"></span><span style="width:20px;height:3px;border-radius:2px;background:#1F4E77"></span><span style="width:20px;height:3px;border-radius:2px;background:#1F4E77"></span></span></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1896,&quot;height&quot;:64},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;dealer&quot;,&quot;priorities&quot;,&quot;research&quot;,&quot;tasks&quot;,&quot;menu&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active || '';
    return { dOn: a === 'dealer', dOff: a !== 'dealer', pOn: a === 'priorities', pOff: a !== 'priorities', rOn: a === 'research', rOff: a !== 'research', tOn: a === 'tasks', tOff: a !== 'tasks', mOn: a === 'menu', mOff: a !== 'menu' };
  }
}
</script>
</body>
</html>
